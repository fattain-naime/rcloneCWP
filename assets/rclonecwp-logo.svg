<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.3"/>
  
  <!-- Cloud (Backup destination) -->
  <path d="M60,110 Q50,110 48,100 Q40,95 42,85 Q44,75 55,75 Q58,60 75,60 Q92,60 98,72 Q108,68 118,78 Q128,82 125,95 Q122,105 110,108 L70,108 Q62,110 60,110 Z" 
        fill="url(#cloudGrad)" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Up Arrow (Backup action) -->
  <path d="M100,45 L100,85 M100,45 L85,60 M100,45 L115,60" 
        stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- rclone text -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00d4aa">rclone</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">CWP</text>
  
  <!-- Small CWP bracket -->
  <rect x="35" y="130" width="4" height="45" rx="2" fill="#00a8e8" opacity="0.6"/>
  <rect x="161" y="130" width="4" height="45" rx="2" fill="#00a8e8" opacity="0.6"/>
</svg>